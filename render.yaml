# Render Blueprint for the FinFlow FastAPI backend + web build.
# Deploy: Render Dashboard → New → Blueprint → pick the GitHub repo (azkanurunala/finflow).
# Render reads this file, creates the services, then prompts for the secret env vars
# marked `sync: false` (MONGO_URL, OPENAI_API_KEY, EMERGENT_LLM_KEY).
services:
  - type: web
    name: finflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        value: https://finflow-backend-fshd.onrender.com
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        value: 260348533003-1qc1pd6378kprbftvufvh2sqvu449cll.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
        value: 260348533003-cg7t1tiek9desq6foa7n23g580aiam7j.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
        value: 260348533003-ih7hkkbt89ooj0q4tvtla4hku0n4aiha.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: finflow-backend
    runtime: python
    plan: free          # 512MB RAM; bump to "starter" if it OOMs on boot (heavy deps).
    rootDir: backend
    region: singapore   # closest to Indonesia; change if you prefer.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DB_NAME
        value: finflow
      # Secrets — set these in the Render dashboard (kept out of git).
      - key: MONGO_URL
        sync: false        # mongodb+srv://...  (from MongoDB Atlas)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.2
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1
      - key: GOOGLE_CLIENT_IDS
        sync: false        # comma-separated Google OAuth client IDs (iOS,Android,Web)
      - key: APPLE_BUNDLE_ID
        value: com.azkanura.finflow
      - key: ADMIN_TOKEN
        sync: false        # for POST /api/admin/codes (redeem code generation)
      - key: REVENUECAT_SECRET_KEY
        sync: false        # RevenueCat REST secret key (entitlement sync)
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false        # Authorization header value set on the RC webhook
